# Styx OS – Limine boot configuration.
# NOTE: Modern Limine binaries look for this file as "limine.conf" on the ISO.
#       build_iso.sh copies this file under both names for compatibility.
#       See README.md §Troubleshooting.

timeout: 3

/Styx OS v0.0.1
    protocol: limine
    path: boot():/boot/kernel
